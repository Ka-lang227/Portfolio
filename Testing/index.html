<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox vs Grid Demo</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <h1>Flexbox vs Grid Demo</h1>
    <button onclick="toggleLayout()">Toggle Layout</button>
    <div id="layout" class="container">
        <div class="item gradient-rgba">1</div>
        <div class="item gradient-opacity">2</div>
        <div class="item overlay-box">3</div>
        <div class="item gradient-rgba">4</div>
        <div class="item gradient-opacity">5</div>
        <div class="item overlay-box">6</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
