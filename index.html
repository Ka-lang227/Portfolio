<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
        <title>Routine Builder</title>
    </head>
    <body>
        <div class="container">
            <aside class="menu">
                <h2>Routine Items</h2>
                <div class="draggable-item" draggable="true" data-type="step">Step</div>
                <div class="draggable-item" draggable="true" data-type="break">Break</div>
            </aside>

            <main class="routine-area">
                <h2>Routine Visualizer</h2>
                <div class="routine-grid"></div>
            </main>

            <div class="controls">
                <button class="play" id="play-routine">Play</button>
                <button class="reset" id="reset-routine">Reset</button>
                <button id="save-routine">Save</button>
                <!-- <button id="clear-routine">Clear</button> -->
                <!-- Fixed ID -->
            </div>
        </div>
        <!-- Edit Modal -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <input type="text" id="editInput" />
                <div class="modal-buttons">
                    <button id="saveEdit">Save</button>
                    <button id="cancelEdit">Cancel</button>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
